<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MedScout — interactive prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1a; font-family: 'Lexend', system-ui, sans-serif; }
  #root { width: 100vw; min-height: 100vh; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes slideDown { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  button:active { transform: scale(0.97); transition: transform 80ms; }

  /* ─────────── PRINT LAYOUT ─────────── */
  html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #print-deck { display: flex; flex-direction: column; }
  .print-page {
    break-after: page; break-inside: avoid;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; gap: 18px; padding: 24px 0; box-sizing: border-box;
  }
  .print-page:last-child { break-after: auto; }
  .print-cap {
    color: #8B949E; font-size: 14px; font-weight: 600; letter-spacing: 0.4px;
    text-transform: uppercase; text-align: center;
  }
  @page { size: portrait; margin: 0.5cm; }
  @media print {
    *, *::before, *::after {
      animation-delay: -99s !important; animation-duration: .001s !important;
      animation-iteration-count: 1 !important; animation-fill-mode: both !important;
      animation-play-state: running !important; transition-duration: 0s !important;
    }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="react">
// MedScout hi-fi — design tokens, primitives, icons

const TOK = {
  bg: "#0D1117",
  surface: "#161B22",
  surface2: "#1C232C",
  border: "#30363D",
  borderSoft: "#21262D",
  primary: "#F97316",
  primaryGlow: "rgba(249,115,22,0.18)",
  primaryDim: "rgba(249,115,22,0.10)",
  success: "#22C55E",
  successDim: "rgba(34,197,94,0.12)",
  danger: "#EF4444",
  dangerDim: "rgba(239,68,68,0.12)",
  vault: "#8B5CF6",
  vaultDim: "rgba(139,92,246,0.14)",
  text: "#F0F6FC",
  textMuted: "#8B949E",
  textDim: "#6E7681",
};

// ───────── Phone shell (iPhone-ish, dark, MedScout-tuned) ─────────
const Phone = ({ children, w = 390, h = 800, time = "9:41", showStatusBar = true, onTap, dataAttrs = {} }) => (
  <div
    style={{
      width: w, height: h, borderRadius: 48, overflow: "hidden",
      position: "relative", background: "#000",
      boxShadow: "0 24px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.06), 0 0 0 8px #1a1a1a",
      fontFamily: "'Lexend', system-ui, sans-serif",
      WebkitFontSmoothing: "antialiased",
    }}
    onClick={onTap}
    {...dataAttrs}
  >
    {/* dynamic island */}
    <div style={{
      position: "absolute", top: 11, left: "50%", transform: "translateX(-50%)",
      width: 120, height: 35, borderRadius: 22, background: "#000", zIndex: 50,
    }} />
    {/* screen content */}
    <div style={{
      position: "absolute", inset: 0,
      background: TOK.bg, color: TOK.text,
      display: "flex", flexDirection: "column", overflow: "hidden",
    }}>
      {showStatusBar && (
        <div style={{
          height: 54, paddingTop: 18,
          display: "flex", alignItems: "center", justifyContent: "space-between",
          padding: "18px 32px 0",
          fontSize: 15, fontWeight: 600, color: TOK.text, letterSpacing: -0.2,
          flexShrink: 0,
        }}>
          <span>{time}</span>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <Icon.signal/> <Icon.wifi/> <Icon.battery/>
          </div>
        </div>
      )}
      <div style={{ flex: 1, position: "relative", overflow: "hidden" }}>{children}</div>
    </div>
    {/* home indicator */}
    <div style={{
      position: "absolute", bottom: 8, left: "50%", transform: "translateX(-50%)",
      width: 134, height: 5, borderRadius: 100, background: "rgba(255,255,255,0.5)", zIndex: 60,
    }} />
  </div>
);

// ───────── Icons (line, 24px) ─────────
const ic = (path, { size = 22, stroke = "currentColor", fill = "none", sw = 1.8, viewBox = "0 0 24 24" } = {}) =>
  <svg width={size} height={size} viewBox={viewBox} fill={fill} stroke={stroke} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}>{path}</svg>;

const Icon = {
  home:    (p={}) => ic(<><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></>, p),
  phone:   (p={}) => ic(<path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/>, p),
  map:     (p={}) => ic(<><path d="M1 6v15l7-3 8 3 7-3V3l-7 3-8-3-7 3z"/><path d="M8 3v15M16 6v15"/></>, p),
  user:    (p={}) => ic(<><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></>, p),
  doc:     (p={}) => ic(<><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></>, p),
  lock:    (p={}) => ic(<><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></>, p),
  plus:    (p={}) => ic(<><path d="M12 5v14M5 12h14"/></>, p),
  bolt:    (p={}) => ic(<path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/>, { ...p, fill: "currentColor" }),
  check:   (p={}) => ic(<path d="M5 13l4 4L19 7"/>, p),
  x:       (p={}) => ic(<path d="M6 6l12 12M18 6L6 18"/>, p),
  alert:   (p={}) => ic(<><path d="M10.3 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></>, p),
  back:    (p={}) => ic(<><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></>, p),
  edit:    (p={}) => ic(<><path d="M17 3a2.83 2.83 0 014 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></>, p),
  spark:   (p={}) => ic(<><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></>, p),
  share:   (p={}) => ic(<><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><path d="M16 6l-4-4-4 4M12 2v13"/></>, p),
  clock:   (p={}) => ic(<><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></>, p),
  pin:     (p={}) => ic(<><path d="M12 22s-7-7-7-13a7 7 0 0114 0c0 6-7 13-7 13z"/><circle cx="12" cy="9" r="2.5"/></>, p),
  filter:  (p={}) => ic(<path d="M3 4h18l-7 9v6l-4 2v-8L3 4z"/>, p),
  signal:  () => <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#F0F6FC"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#F0F6FC"/><rect x="9" y="3" width="3" height="8" rx="1" fill="#F0F6FC"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#F0F6FC"/></svg>,
  wifi:    () => <svg width="17" height="12" viewBox="0 0 17 12" fill="#F0F6FC"><path d="M8.5 3.2a8 8 0 015.7 2.3l1-1A9.5 9.5 0 008.5 1.7 9.5 9.5 0 001.8 4.5l1 1a8 8 0 015.7-2.3z"/><path d="M8.5 6.5a4.7 4.7 0 013.4 1.4l1-1a6.2 6.2 0 00-8.8 0l1 1A4.7 4.7 0 018.5 6.5z"/><circle cx="8.5" cy="10" r="1.5"/></svg>,
  battery: () => <svg width="26" height="12" viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="#F0F6FC" strokeOpacity="0.45" fill="none"/><rect x="2" y="2" width="19" height="8" rx="1.6" fill="#F0F6FC"/><rect x="23.5" y="3.5" width="2" height="5" rx="1" fill="#F0F6FC" fillOpacity="0.45"/></svg>,
  drag:    (p={}) => ic(<><circle cx="9" cy="6" r="1.5" fill="currentColor"/><circle cx="15" cy="6" r="1.5" fill="currentColor"/><circle cx="9" cy="12" r="1.5" fill="currentColor"/><circle cx="15" cy="12" r="1.5" fill="currentColor"/><circle cx="9" cy="18" r="1.5" fill="currentColor"/><circle cx="15" cy="18" r="1.5" fill="currentColor"/></>, { ...p, sw: 0 }),
  minus:   (p={}) => ic(<path d="M5 12h14"/>, p),
  rotate:  (p={}) => ic(<><path d="M3 12a9 9 0 0115-6.7L21 8"/><path d="M21 3v5h-5"/></>, p),
  bell:    (p={}) => ic(<><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 004 0"/></>, p),
  faceid:  (p={}) => ic(<><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/><path d="M9 9v1M15 9v1M9 15s1 1.5 3 1.5S15 15 15 15M12 9v3.5h-1"/></>, p),
  pill:    (p={}) => ic(<><rect x="2" y="9" width="20" height="6" rx="3" transform="rotate(-30 12 12)"/><path d="M8.5 8.5l7 7" transform="rotate(-30 12 12)"/></>, p),
  flame:   (p={}) => ic(<path d="M12 2s4 4 4 8a4 4 0 11-8 0c0-1 .5-2 1-3 0 0 0 3 2 3s2-2 1-4-2-3-2-4 1-1 2 0z"/>, { ...p, fill: "currentColor" }),
  trophy:  (p={}) => ic(<><path d="M6 4h12v4a6 6 0 01-12 0V4z"/><path d="M6 6H3a3 3 0 003 3M18 6h3a3 3 0 01-3 3M9 17h6M10 17v3h4v-3"/></>, p),
  search:  (p={}) => ic(<><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></>, p),
  arrow:   (p={}) => ic(<><path d="M5 12h14M13 6l6 6-6 6"/></>, p),
  star:    (p={}) => ic(<path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/>, p),
};

// ───────── Tab bar ─────────
const TabBar = ({ active = "home", onChange = () => {} }) => {
  const tabs = [
    { id: "home", label: "Home", icon: Icon.home },
    { id: "hunt", label: "Hunt", icon: Icon.phone },
    { id: "map",  label: "Map",  icon: Icon.map },
    { id: "me",   label: "Me",   icon: Icon.user },
  ];
  return (
    <div style={{
      borderTop: `0.5px solid ${TOK.border}`,
      background: "rgba(13,17,23,0.92)",
      backdropFilter: "blur(20px)",
      padding: "8px 12px 22px",
      display: "flex", justifyContent: "space-around",
      flexShrink: 0,
    }}>
      {tabs.map(t => {
        const a = t.id === active;
        return (
          <button key={t.id} onClick={() => onChange(t.id)} style={{
            background: "none", border: "none", padding: "6px 10px",
            display: "flex", flexDirection: "column", alignItems: "center", gap: 3,
            color: a ? TOK.primary : TOK.textMuted,
            cursor: "pointer", fontFamily: "inherit",
          }}>
            <t.icon size={24} sw={a ? 2.2 : 1.8}/>
            <span style={{ fontSize: 10, fontWeight: a ? 600 : 500, letterSpacing: 0.1 }}>{t.label}</span>
          </button>
        );
      })}
    </div>
  );
};

// ───────── Card primitives ─────────
const Card = ({ children, style = {}, accent = false, danger = false, success = false, onClick }) => (
  <div onClick={onClick} style={{
    background: TOK.surface,
    border: `1px solid ${accent ? TOK.primary : danger ? TOK.danger : success ? TOK.success : TOK.border}`,
    borderRadius: 14,
    padding: 14,
    cursor: onClick ? "pointer" : "default",
    ...style,
  }}>{children}</div>
);

const Btn = ({ children, onClick, variant = "primary", size = "md", full = true, style = {}, disabled = false, dataAttrs = {} }) => {
  const sizes = {
    sm: { padding: "8px 14px", fontSize: 13, h: 36 },
    md: { padding: "12px 18px", fontSize: 15, h: 48 },
    lg: { padding: "16px 20px", fontSize: 16, h: 56 },
  };
  const s = sizes[size];
  const variants = {
    primary: { bg: TOK.primary, color: "#0D1117", border: TOK.primary, shadow: `0 4px 16px ${TOK.primaryGlow}` },
    success: { bg: TOK.success, color: "#0D1117", border: TOK.success, shadow: "0 4px 16px rgba(34,197,94,0.2)" },
    ghost:   { bg: "transparent", color: TOK.textMuted, border: TOK.border, shadow: "none" },
    outline: { bg: "transparent", color: TOK.primary, border: TOK.primary, shadow: "none" },
    dark:    { bg: TOK.surface2, color: TOK.text, border: TOK.border, shadow: "none" },
  };
  const v = variants[variant];
  return (
    <button onClick={onClick} disabled={disabled} {...dataAttrs} style={{
      background: v.bg, color: v.color, border: `1px solid ${v.border}`,
      borderRadius: 12, padding: s.padding, fontSize: s.fontSize, fontWeight: 600,
      minHeight: s.h, width: full ? "100%" : "auto",
      fontFamily: "inherit", cursor: disabled ? "not-allowed" : "pointer",
      opacity: disabled ? 0.4 : 1, boxShadow: v.shadow,
      letterSpacing: -0.1,
      display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8,
      ...style,
    }}>{children}</button>
  );
};

const Badge = ({ children, kind = "muted", style = {} }) => {
  const kinds = {
    success: { c: TOK.success, bg: TOK.successDim },
    danger:  { c: TOK.danger, bg: TOK.dangerDim },
    primary: { c: TOK.primary, bg: TOK.primaryDim },
    vault:   { c: TOK.vault, bg: TOK.vaultDim },
    muted:   { c: TOK.textMuted, bg: "rgba(139,148,158,0.1)" },
  };
  const k = kinds[kind];
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 4,
      padding: "3px 8px", borderRadius: 6, fontSize: 11, fontWeight: 600,
      color: k.c, background: k.bg, letterSpacing: 0.1,
      ...style,
    }}>{children}</span>
  );
};

// Status with text + dot (never color alone — accessibility rule)
const Status = ({ kind = "muted", label, style = {} }) => {
  const map = {
    ok: { c: TOK.success, t: label || "in stock" },
    out: { c: TOK.danger, t: label || "out" },
    soon: { c: TOK.primary, t: label || "check back" },
    muted: { c: TOK.textMuted, t: label || "—" },
  };
  const s = map[kind];
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 12, color: s.c, fontWeight: 500, ...style }}>
      <span style={{ width: 7, height: 7, borderRadius: 999, background: s.c }}/>
      {s.t}
    </span>
  );
};

Object.assign(window, { TOK, Phone, Icon, TabBar, Card, Btn, Badge, Status });

// MedScout hi-fi — screen components

// ═══════════════════════════════════════════════════════════════
// 1. DASHBOARD
// ═══════════════════════════════════════════════════════════════
const Dashboard = ({ onStartHunt, onLogRefill, onOpenPharmacy }) => {
  const [bannerDismissed, setBannerDismissed] = React.useState(false);
  const days = 6;
  const ringColor = days > 10 ? TOK.success : days >= 5 ? TOK.primary : TOK.danger;

  const recentCalls = [
    { n: "Walgreens · Main St", t: "2h ago", k: "out" },
    { n: "Corner Pharmacy", t: "Yesterday", k: "soon", label: "back Fri" },
    { n: "Target Rx", t: "Friday", k: "ok" },
    { n: "CVS · Main", t: "Thu", k: "ok" },
    { n: "Rite Aid · Pine", t: "Wed", k: "out" },
    { n: "Walmart Rx", t: "Tue", k: "soon", label: "back Sun" },
    { n: "Sav-On · 4th", t: "Mon", k: "ok" },
    { n: "Costco Pharmacy", t: "Last week", k: "out" },
    { n: "Walgreens · 5th", t: "Last week", k: "ok" },
  ];

  return (
    <div data-screen-label="01 Dashboard" style={{ display: "flex", flexDirection: "column", height: "100%", minHeight: 0 }}>
      {/* Fixed header region */}
      <div style={{ padding: "8px 16px 0", flexShrink: 0 }}>
        {!bannerDismissed && (
          <div style={{
            display: "flex", alignItems: "center", gap: 10,
            background: TOK.dangerDim, border: `1px solid rgba(239,68,68,0.3)`,
            borderRadius: 10, padding: "9px 12px", marginBottom: 16, fontSize: 12,
          }}>
            <Icon.alert size={16} stroke={TOK.danger}/>
            <span style={{ flex: 1, color: TOK.text }}>Regional shortage: <span style={{ color: TOK.textMuted }}>34% lower fills this week</span></span>
            <button onClick={() => setBannerDismissed(true)} style={{ background: "none", border: "none", color: TOK.textMuted, cursor: "pointer", padding: 2, display: "flex" }}>
              <Icon.x size={14}/>
            </button>
          </div>
        )}

        <div style={{ marginBottom: 4, fontSize: 13, color: TOK.textMuted }}>Adderall XR · 20mg</div>
        <h1 style={{ fontSize: 26, fontWeight: 700, margin: "0 0 16px", letterSpacing: -0.6, lineHeight: 1.15 }}>You're 6 days ahead</h1>

        {/* Ring */}
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 18 }}>
          <Ring days={days} color={ringColor}/>
        </div>

        <Btn variant="primary" size="lg" onClick={onStartHunt}>
          <Icon.phone size={18}/> Start today's hunt
        </Btn>

        <div style={{ marginTop: 12, marginBottom: 16, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontSize: 11, color: TOK.textDim, letterSpacing: 0.3 }}>
          <span>5 PHARMACIES · 0 CALLED TODAY</span>
          <span style={{ color: TOK.border }}>·</span>
          <button onClick={onLogRefill} style={{ background: "none", border: "none", color: TOK.success, fontFamily: "inherit", fontSize: 11, fontWeight: 600, letterSpacing: 0.3, cursor: "pointer", padding: 0 }}>LOG REFILL →</button>
        </div>
      </div>

      {/* Scrollable region: insight + recent calls */}
      <div style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: "0 16px 16px", WebkitMaskImage: "linear-gradient(to bottom, black calc(100% - 20px), transparent)", maskImage: "linear-gradient(to bottom, black calc(100% - 20px), transparent)" }}>
        {/* Insight card */}
        <Card accent style={{ background: TOK.primaryDim, borderColor: "rgba(249,115,22,0.4)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: TOK.primary, fontWeight: 600, letterSpacing: 0.6, marginBottom: 6 }}>
            <Icon.spark size={13} stroke={TOK.primary}/> INSIGHT
          </div>
          <div style={{ fontSize: 14, lineHeight: 1.4, color: TOK.text }}>
            CVS Main has had stock <strong style={{ color: TOK.primary }}>3 of the last 4 weeks</strong> — your best near-term bet.
          </div>
        </Card>

        <div style={{ marginTop: 22, marginBottom: 8, fontSize: 11, color: TOK.textDim, fontWeight: 600, letterSpacing: 0.6 }}>RECENT CALLS</div>
        <Card style={{ padding: 0 }}>
          {recentCalls.map((r, i) => (
            <div key={i} onClick={() => onOpenPharmacy && onOpenPharmacy({ n: r.n, k: r.k, label: r.label, sub: "" })} style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "12px 14px", cursor: "pointer",
              borderBottom: i < recentCalls.length - 1 ? `0.5px solid ${TOK.borderSoft}` : "none",
            }}>
              <div>
                <div style={{ fontSize: 14, fontWeight: 500 }}>{r.n}</div>
                <div style={{ fontSize: 11, color: TOK.textMuted, marginTop: 2 }}>{r.t}</div>
              </div>
              <Status kind={r.k} label={r.label}/>
            </div>
          ))}
        </Card>
      </div>
      <TabBar active="home"/>
    </div>
  );
};

// Animated progress ring
const Ring = ({ days, color }) => {
  const size = 168, stroke = 11;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const pct = Math.min(days / 14, 1);
  return (
    <div style={{ position: "relative", width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={TOK.surface} strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
          strokeDasharray={`${c * pct} ${c}`} strokeLinecap="round"

// ═══════════════════════════════════════════════════════════════
// ONBOARDING — 4-step flow
// ═══════════════════════════════════════════════════════════════
const Onboarding = ({ onDone }) => {
  const [step, setStep] = React.useState(0);
  const [selectedMed, setSelectedMed] = React.useState(ADHD_MEDS[1]); // Adderall XR default
  const [dose, setDose] = React.useState("20mg");
  const [count, setCount] = React.useState(30);
  const [saved, setSaved] = React.useState(["Walgreens · Main", "Corner Pharmacy"]);
  const [query, setQuery] = React.useState("");
  const [pickerOpen, setPickerOpen] = React.useState(false);
  const med = `${selectedMed.brand}${selectedMed.form && !selectedMed.brand.includes(selectedMed.form) ? ` (${selectedMed.form})` : ""}`;
  const [pickerFilter, setPickerFilter] = React.useState("all"); // all | brand | generic
  const filtered = React.useMemo(() => {
    const q = query.trim().toLowerCase();
    return ADHD_MEDS.filter(m => {
      if (pickerFilter === "brand" && m.isGeneric) return false;
      if (pickerFilter === "generic" && !m.isGeneric) return false;
      if (!q) return true;
      return m.brand.toLowerCase().includes(q) ||
        m.generic.toLowerCase().includes(q) ||
        m.form.toLowerCase().includes(q);
    });
  }, [query, pickerFilter]);
  const next = () => step < 3 ? setStep(step + 1) : onDone();
  const titles = ["Welcome", "Your medication", "Save pharmacies", "You're set"];
  return (
    <div data-screen-label="00 Onboarding" style={{ display: "flex", flexDirection: "column", height: "100%", padding: "12px 20px 22px" }}>
      <div style={{ display: "flex", gap: 4, marginBottom: 22 }}>
        {[0,1,2,3].map(i => (
          <div key={i} style={{ flex: 1, height: 3, borderRadius: 2, background: i <= step ? TOK.primary : TOK.border, transition: "background 200ms" }}/>
        ))}
      </div>
      <div style={{ fontSize: 11, color: TOK.textDim, fontWeight: 600, letterSpacing: 0.6, marginBottom: 8 }}>STEP {step + 1} OF 4</div>
      <h1 style={{ fontSize: 28, fontWeight: 700, margin: "0 0 8px", letterSpacing: -0.6, lineHeight: 1.15 }}>{titles[step]}</h1>

      {step === 0 && (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", textAlign: "center", padding: "0 8px" }}>
          <div style={{ width: 92, height: 92, borderRadius: 999, background: TOK.primaryDim, border: `2px solid ${TOK.primary}`, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 24 }}>
            <Icon.pill size={46} stroke={TOK.primary}/>
          </div>
          <div style={{ fontSize: 16, color: TOK.text, lineHeight: 1.5, marginBottom: 14 }}>Find your meds without the dread.</div>
          <div style={{ fontSize: 13, color: TOK.textMuted, lineHeight: 1.5 }}>MedScout helps you call pharmacies efficiently, log results, and find stock from the community — without sharing more than you want to.</div>
        </div>
      )}

      {step === 1 && !pickerOpen && (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>
          <div style={{ fontSize: 14, color: TOK.textMuted, marginBottom: 22 }}>What are you tracking? You can add more later.</div>
          <div style={{ fontSize: 11, color: TOK.textDim, fontWeight: 600, letterSpacing: 0.6, marginBottom: 8 }}>MEDICATION</div>
          <button onClick={() => setPickerOpen(true)} style={{ width: "100%", padding: "12px 14px", background: TOK.surface, border: `1px solid ${TOK.border}`, borderRadius: 10, color: TOK.text, fontSize: 15, fontFamily: "inherit", marginBottom: 16, boxSizing: "border-box", textAlign: "left", cursor: "pointer", display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontWeight: 600, marginBottom: 2 }}>{selectedMed.brand}<span style={{ color: TOK.textMuted, fontWeight: 500 }}> · {selectedMed.form}</span></div>
              <div style={{ fontSize: 11, color: TOK.textDim }}>{selectedMed.generic}</div>
            </div>
            <Icon.search size={16} stroke={TOK.textMuted}/>
          </button>
          <div style={{ fontSize: 11, color: TOK.textDim, fontWeight: 600, letterSpacing: 0.6, marginBottom: 8 }}>DOSE</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 16 }}>
            {selectedMed.doses.map(d => (
              <button key={d} onClick={() => setDose(d)} style={{ padding: "9px 14px", fontSize: 13, fontWeight: 600, border: `1px solid ${dose === d ? TOK.primary : TOK.border}`, background: dose === d ? TOK.primaryDim : "transparent", color: dose === d ? TOK.primary : TOK.textMuted, borderRadius: 10, cursor: "pointer", fontFamily: "inherit" }}>{d}</button>
            ))}
          </div>
          <div style={{ fontSize: 11, color: TOK.textDim, fontWeight: 600, letterSpacing: 0.6, marginBottom: 8 }}>SUPPLY</div>
          <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px", background: TOK.surface, border: `1px solid ${TOK.border}`, borderRadius: 10 }}>
            <button onClick={() => setCount(Math.max(1, count - 1))} style={{ width: 32, height: 32, borderRadius: 8, background: TOK.surface2, border: `1px solid ${TOK.border}`, color: TOK.text, cursor: "pointer", fontSize: 18 }}>−</button>
            <div style={{ flex: 1, textAlign: "center", fontSize: 18, fontWeight: 600 }}>{count} <span style={{ fontSize: 13, color: TOK.textMuted, fontWeight: 400 }}>days/refill</span></div>
            <button onClick={() => setCount(count + 1)} style={{ width: 32, height: 32, borderRadius: 8, background: TOK.surface2, border: `1px solid ${TOK.border}`, color: TOK.text, cursor: "pointer", fontSize: 18 }}>+</button>
          </div>
        </div>
      )}

      {step === 1 && pickerOpen && (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
            <button onClick={() => setPickerOpen(false)} style={{ background: "none", border: "none", color: TOK.textMuted, cursor: "pointer", padding: 6, display: "flex", fontFamily: "inherit", fontSize: 13 }}>← Back</button>
            <div style={{ fontSize: 11, color: TOK.textDim, fontWeight: 600, letterSpacing: 0.6 }}>SELECT MEDICATION</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 12px", background: TOK.surface, border: `1px solid ${TOK.border}`, borderRadius: 10, marginBottom: 10 }}>
            <Icon.search size={16} stroke={TOK.textMuted}/>
            <input autoFocus value={query} onChange={e => setQuery(e.target.value)} placeholder="Search brand, generic, or form…" style={{ flex: 1, background: "transparent", border: "none", outline: "none", fontSize: 14, color: TOK.text, fontFamily: "inherit" }}/>
            {query && <button onClick={() => setQuery("")} style={{ background: "none", border: "none", color: TOK.textMuted, cursor: "pointer", padding: 2, display: "flex" }}><Icon.x size={14}/></button>}
          </div>
          <div style={{ display: "flex", gap: 5, marginBottom: 10 }}>
            {[{id:"all",l:"All"},{id:"brand",l:"Brand"},{id:"generic",l:"Generic"}].map(f => (
              <button key={f.id} onClick={() => setPickerFilter(f.id)} style={{ flex: 1, padding: "7px 0", fontSize: 12, fontWeight: 600, border: `1px solid ${pickerFilter === f.id ? TOK.primary : TOK.border}`, background: pickerFilter === f.id ? TOK.primaryDim : "transparent", color: pickerFilter === f.id ? TOK.primary : TOK.textMuted, borderRadius: 8, cursor: "pointer", fontFamily: "inherit" }}>{f.l}</button>
            ))}
          </div>
          <div style={{ flex: 1, overflowY: "auto", marginRight: -4, paddingRight: 4 }}>
            {filtered.length === 0 && (
              <div style={{ textAlign: "center", padding: 32, fontSize: 13, color: TOK.textMuted }}>No matches.<br/><span style={{ fontSize: 11, color: TOK.textDim }}>Try "Concerta" or "atomoxetine"</span></div>
            )}
            {filtered.map((m, i) => {
              const isSel = m.brand === selectedMed.brand && m.form === selectedMed.form;
              const cl = CLS_LABELS[m.cls];
              return (
                <button key={`${m.brand}-${m.form}-${i}`} onClick={() => { setSelectedMed(m); setDose(m.doses[Math.floor(m.doses.length/2)]); setPickerOpen(false); setQuery(""); }} style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "11px 12px", background: isSel ? TOK.primaryDim : TOK.surface, border: `1px solid ${isSel ? TOK.primary : TOK.borderSoft}`, borderRadius: 10, marginBottom: 5, cursor: "pointer", fontFamily: "inherit", textAlign: "left" }}>
                  <div style={{ width: 4, height: 36, background: cl.color, borderRadius: 2, flexShrink: 0 }}/>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 14, fontWeight: 600, color: TOK.text, marginBottom: 2, display: "flex", alignItems: "center", gap: 6 }}>
                      <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{m.brand} <span style={{ color: TOK.textMuted, fontWeight: 500, fontSize: 12 }}>· {m.form}</span></span>
                      {m.isGeneric && <span style={{ fontSize: 8, fontWeight: 700, letterSpacing: 0.4, color: TOK.textMuted, padding: "2px 5px", borderRadius: 3, border: `1px solid ${TOK.border}`, flexShrink: 0 }}>GENERIC</span>}
                    </div>
                    <div style={{ fontSize: 11, color: TOK.textDim, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{m.generic} · {m.doses.length} dose{m.doses.length > 1 ? "s" : ""}</div>
                  </div>
                  <span style={{ fontSize: 9, fontWeight: 700, letterSpacing: 0.4, color: cl.color, padding: "3px 6px", borderRadius: 4, background: `${cl.color}1f`, flexShrink: 0 }}>{cl.label.toUpperCase()}</span>
                </button>
              );
            })}
          </div>
          <div style={{ fontSize: 10, color: TOK.textDim, marginTop: 8, textAlign: "center" }}>{filtered.length} of {ADHD_MEDS.length}</div>
        </div>
      )}

      {step === 2 && (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>
          <div style={{ fontSize: 14, color: TOK.textMuted, marginBottom: 16 }}>We'll start with pharmacies near 92706. Tap to save.</div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 12px", background: TOK.surface, border: `1px solid ${TOK.border}`, borderRadius: 10, marginBottom: 12 }}>
            <Icon.search size={16} stroke={TOK.textMuted}/>
            <span style={{ flex: 1, fontSize: 13, color: TOK.textMuted }}>Search by name or ZIP</span>
          </div>
          <div style={{ flex: 1, overflowY: "auto", marginRight: -4, paddingRight: 4 }}>
            {["Walgreens · Main", "Corner Pharmacy", "Target Rx", "CVS · Elm", "Family Care Rx", "Sav-On · 4th", "Costco Rx"].map(name => {
              const isSaved = saved.includes(name);
              return (
                <div key={name} onClick={() => setSaved(s => isSaved ? s.filter(x => x !== name) : [...s, name])} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", background: TOK.surface, border: `1px solid ${isSaved ? TOK.primary : TOK.borderSoft}`, borderRadius: 10, marginBottom: 6, cursor: "pointer" }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 14, fontWeight: 500 }}>{name}</div>
                    <div style={{ fontSize: 11, color: TOK.textMuted, marginTop: 2 }}>{(0.4 + Math.random() * 2).toFixed(1)}mi</div>
                  </div>
                  {isSaved ? <Icon.check size={18} stroke={TOK.primary}/> : <Icon.plus size={18} stroke={TOK.textMuted}/>}
                </div>
              );
            })}
          </div>
          <div style={{ fontSize: 11, color: TOK.textDim, marginTop: 8, textAlign: "center" }}>{saved.length} saved</div>
        </div>
      )}

      {step === 3 && (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", textAlign: "center", padding: "0 8px" }}>
          <div style={{ width: 92, height: 92, borderRadius: 999, background: TOK.successDim, border: `2px solid ${TOK.success}`, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 24 }}>
            <Icon.check size={46} stroke={TOK.success}/>
          </div>
          <div style={{ fontSize: 18, color: TOK.text, lineHeight: 1.4, marginBottom: 8, fontWeight: 600 }}>{med} · {dose} · {count}-day supply</div>
          <div style={{ fontSize: 14, color: TOK.textMuted, lineHeight: 1.5, marginBottom: 24 }}>{saved.length} pharmacies saved. We'll remind you 7 days before run-out.</div>
          <Card style={{ background: TOK.vaultDim, borderColor: "rgba(139,92,246,0.4)", padding: 14, width: "100%", textAlign: "left" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: TOK.vault, fontWeight: 700, letterSpacing: 0.6, marginBottom: 4 }}>
              <Icon.lock size={13} stroke={TOK.vault}/> VAULT IS PRIVATE
            </div>
            <div style={{ fontSize: 12, color: TOK.text, lineHeight: 1.4 }}>Your medication and call logs never leave your device unless you contribute to community.</div>
          </Card>
        </div>
      )}

      <div style={{ marginTop: 18 }}>
        <Btn variant="primary" size="lg" onClick={next}>{step === 3 ? "Open MedScout" : "Continue"}</Btn>
        {step > 0 && step < 3 && <Btn variant="ghost" style={{ marginTop: 8 }} onClick={() => setStep(step - 1)}>Back</Btn>}
      </div>
    </div>
  );
};

// VAULT UNLOCK — Face ID gate
// ═══════════════════════════════════════════════════════════════
const VaultUnlock = ({ onUnlock, onCancel }) => {
  const [state, setState] = React.useState("idle"); // idle | scanning | success
  const trigger = () => {
    setState("scanning");
    setTimeout(() => { setState("success"); setTimeout(onUnlock, 600); }, 1300);
  };
  return (
    <div data-screen-label="08 Vault Unlock" style={{ display: "flex", flexDirection: "column", height: "100%", background: "rgba(13,17,23,0.96)", backdropFilter: "blur(20px)" }}>
      <div style={{ display: "flex", justifyContent: "flex-end", padding: "12px 16px" }}>
        <button onClick={onCancel} style={{ background: "none", border: "none", color: TOK.textMuted, cursor: "pointer", padding: 6, display: "flex", fontFamily: "inherit", fontSize: 14 }}>Cancel</button>
      </div>
      <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "0 32px", textAlign: "center" }}>
        <div style={{
          width: 130, height: 130, borderRadius: 28,
          background: state === "success" ? TOK.successDim : TOK.vaultDim,
          border: `2px solid ${state === "success" ? TOK.success : TOK.vault}`,
          display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 28,
          position: "relative", transition: "all 300ms",
        }}>
          {state === "success"
            ? <Icon.check size={64} stroke={TOK.success}/>
            : <Icon.faceid size={72} stroke={TOK.vault} sw={1.4}/>}
          {state === "scanning" && (
            <div style={{ position: "absolute", inset: -6, borderRadius: 32, border: `2px solid ${TOK.vault}`, animation: "pulse 1.4s ease-in-out infinite" }}/>
          )}
        </div>
        <div style={{ fontSize: 22, fontWeight: 700, marginBottom: 8, letterSpacing: -0.4 }}>
          {state === "success" ? "Unlocked" : state === "scanning" ? "Scanning…" : "Unlock Vault"}
        </div>
        <div style={{ fontSize: 14, color: TOK.textMuted, lineHeight: 1.5, maxWidth: 280, marginBottom: 32 }}>
          {state === "idle" && "Confirm your identity to view community pharmacies and contribute reports."}
          {state === "scanning" && "Hold your phone steady…"}
          {state === "success" && "Welcome back."}
        </div>
        {state === "idle" && (
          <Btn variant="outline" onClick={trigger} style={{ borderColor: TOK.vault, color: TOK.vault }}>
            <Icon.faceid size={18} stroke={TOK.vault}/> Use Face ID
          </Btn>
        )}
      </div>
      <div style={{ padding: "0 32px 32px", textAlign: "center", fontSize: 11, color: TOK.textDim }}>
        Your vault is encrypted on this device.
      </div>
    </div>
  );
};

  };

  const onCallPharmacy = (p) => { setPharmacy(p); setScreen("preflight"); };
  const onOpenPharmacy = (p) => { setPharmacy(p); setReturnScreen(screen); setScreen("pharmDetail"); };
  const openModal = (s) => { setReturnScreen(screen); setScreen(s); };

  const handleConfirmPostCall = () => {
    setScreen("dialer");
    setShowToast(true);
    setTimeout(() => setShowToast(false), 3500);
  };

  const handleUnlockVault = (cb) => {
    setPendingVaultCb(() => cb);
    setScreen("vault");
  };

  let inner;
  if (screen === "onboard") {
    inner = <Onboarding onDone={() => setScreen("dashboard")} />;
  } else if (screen === "dashboard") {
    inner = <ScreenWithTab tab="home" onTabChange={onTabChange}><Dashboard onStartHunt={() => { setTab("hunt"); setScreen("dialer"); }} onLogRefill={() => openModal("refill")} onOpenPharmacy={onOpenPharmacy}/></ScreenWithTab>;
  } else if (screen === "dialer") {
    inner = (
      <ScreenWithTab tab="hunt" onTabChange={onTabChange}>
        <Dialer onCallPharmacy={onCallPharmacy} onAddPharmacy={() => openModal("addPharm")} onOpenPharmacy={onOpenPharmacy} segment={segment} onSegmentChange={setSegment}/>
        {showToast && <PostCallToast onDismiss={() => setShowToast(false)}/>}
      </ScreenWithTab>
    );
  } else if (screen === "preflight") {
    inner = <PreFlight pharmacy={pharmacy} onBack={() => setScreen("dialer")} onSkipScript={() => setScreen("active")} onStartCall={() => setScreen("active")} />;
  } else if (screen === "active") {
    inner = <ActiveCall pharmacy={pharmacy} onEnd={() => setScreen("postcall")} />;
  } else if (screen === "postcall") {
    inner = <ScreenWithTab tab="hunt" onTabChange={onTabChange}><PostCall pharmacy={pharmacy} onConfirm={handleConfirmPostCall} onDiscard={() => setScreen("dialer")} onCallPharmacy={onCallPharmacy} onSegmentChange={setSegment}/></ScreenWithTab>;
  } else if (screen === "map") {
    inner = <ScreenWithTab tab="map" onTabChange={onTabChange}><MapScreen onUnlockVault={handleUnlockVault} onContribute={() => openModal("contribute")}/></ScreenWithTab>;
  } else if (screen === "profile") {
    inner = <ScreenWithTab tab="me" onTabChange={onTabChange}><Profile onEditMeds={() => openModal("editMed")} onAddPharmacy={() => openModal("addPharm")} onContribute={() => openModal("contribute")} onLogRefill={() => openModal("refill")}/></ScreenWithTab>;
  } else if (screen === "notif") {
    inner = <NotifDeepLink onTapNotif={() => { setPharmacy(PHARMACIES[1]); setScreen("preflight"); }}/>;
  } else if (screen === "vault") {
    inner = <VaultUnlock onUnlock={() => { if (pendingVaultCb) pendingVaultCb(); setPendingVaultCb(null); setScreen("map"); }} onCancel={() => { setPendingVaultCb(null); setScreen("map"); }}/>;
  } else if (screen === "pharmDetail") {
    inner = <PharmacyDetail pharmacy={pharmacy} onBack={() => setScreen(returnScreen)} onCall={onCallPharmacy}/>;
  } else if (screen === "addPharm") {
    inner = <AddPharmacy onBack={() => setScreen(returnScreen)} onAdd={() => { setScreen(returnScreen); }}/>;
  } else if (screen === "refill") {
    inner = <Refill onBack={() => setScreen(returnScreen)} onConfirm={() => { setScreen(returnScreen); setShowToast(true); setTimeout(() => setShowToast(false), 3500); }}/>;
  } else if (screen === "editMed") {
    inner = <EditMedication onBack={() => setScreen(returnScreen)} onAddNew={() => {}}/>;
  } else if (screen === "contribute") {
    inner = <CommunityContribute onBack={() => setScreen(returnScreen)} onSubmit={() => { setScreen(returnScreen); }}/>;
  }

  return (
    <div style={{
      width: "100vw", minHeight: "100vh", background: "#1a1a1a",
      display: "flex", alignItems: "center", justifyContent: "center",
      padding: "24px 16px", boxSizing: "border-box",
      fontFamily: "'Lexend', system-ui, sans-serif",
    }}>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 14 }}>
        <Phone time={screen === "notif" ? "9:18" : "9:41"}>{inner}</Phone>
        <FlowNav screen={screen} setScreen={setScreen} />
      </div>
    </div>
  );
};

const ScreenWithTab = ({ tab, onTabChange, children }) => {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const root = ref.current;
    if (!root) return;
    const handle = (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const span = btn.querySelector("span");
      if (!span) return;
      const label = span.textContent.toLowerCase();
      if (["home","hunt","map","me"].includes(label)) {
        e.stopPropagation();
        onTabChange(label);
      }
    };
    root.addEventListener("click", handle, true);
    return () => root.removeEventListener("click", handle, true);
  }, [onTabChange]);
  return <div ref={ref} style={{ height: "100%" }}>{children}</div>;
};

const FlowNav = ({ screen, setScreen }) => {
  const groups = [
    { l: "Entry", steps: [
      { id: "notif", l: "Notif" },
      { id: "onboard", l: "Onboard" },
    ]},
    { l: "Core flow", steps: [
      { id: "dashboard", l: "1·Dashboard" },
      { id: "dialer", l: "2·Hunt" },
      { id: "preflight", l: "3·Pre-Flight" },
      { id: "active", l: "4·Call" },
      { id: "postcall", l: "5·Post-Call" },
    ]},
    { l: "Other", steps: [
      { id: "map", l: "Map" },
      { id: "vault", l: "Vault" },
      { id: "profile", l: "Me" },
    ]},
    { l: "Details", steps: [
      { id: "pharmDetail", l: "Pharmacy" },
      { id: "addPharm", l: "Add pharm" },
      { id: "refill", l: "Refill" },
      { id: "editMed", l: "Meds" },
      { id: "contribute", l: "Contribute" },
    ]},
  ];
  return (
    <div style={{
      display: "flex", flexDirection: "column", gap: 6,
      maxWidth: 460, padding: "10px 12px",
      background: "rgba(22,27,34,0.6)", border: "1px solid #30363D",
      borderRadius: 14, backdropFilter: "blur(8px)",
    }}>
      {groups.map(g => (
        <div key={g.l} style={{ display: "flex", gap: 6, alignItems: "center" }}>
          <span style={{ fontSize: 9, color: "#6E7681", fontWeight: 600, letterSpacing: 0.6, width: 60 }}>{g.l.toUpperCase()}</span>
          <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
            {g.steps.map(s => (
              <button key={s.id} onClick={() => setScreen(s.id)} style={{
                padding: "5px 8px", fontSize: 10, fontWeight: 600,
                background: screen === s.id ? "#F97316" : "transparent",
                color: screen === s.id ? "#0D1117" : "#8B949E",
                border: `1px solid ${screen === s.id ? "#F97316" : "#30363D"}`,
                borderRadius: 6, cursor: "pointer", fontFamily: "'Lexend', system-ui, sans-serif",
              }}>{s.l}</button>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
};

const PRINT_SCREENS = [
  { label: "Entry · Notification deep link", time: "9:18", el: <NotifDeepLink onTapNotif={()=>{}}/> },
  { label: "Onboarding", el: <Onboarding onDone={()=>{}}/> },
  { label: "01 · Dashboard", el: <Dashboard onStartHunt={()=>{}} onLogRefill={()=>{}} onOpenPharmacy={()=>{}}/> },
  { label: "02 · Hunt / Dialer", el: <Dialer segment="dial" onSegmentChange={()=>{}} onCallPharmacy={()=>{}} onAddPharmacy={()=>{}} onOpenPharmacy={()=>{}}/> },

  { label: "05 · Post-Call", el: <PostCall pharmacy={PHARMACIES[0]} onConfirm={()=>{}} onDiscard={()=>{}} onCallPharmacy={()=>{}} onSegmentChange={()=>{}}/> },
  { label: "Map · heatmap", el: <MapScreen onUnlockVault={()=>{}} onContribute={()=>{}}/> },
  { label: "Vault unlock", el: <VaultUnlock onUnlock={()=>{}} onCancel={()=>{}}/> },
  { label: "Me · Profile", el: <Profile onEditMeds={()=>{}} onAddPharmacy={()=>{}} onContribute={()=>{}} onLogRefill={()=>{}}/> },
  { label: "Pharmacy detail", el: <PharmacyDetail pharmacy={PHARMACIES[0]} onBack={()=>{}} onCall={()=>{}}/> },
  { label: "Add pharmacy", el: <AddPharmacy onBack={()=>{}} onAdd={()=>{}}/> },
  { label: "Log refill", el: <Refill onBack={()=>{}} onConfirm={()=>{}}/> },
  { label: "Edit medication", el: <EditMedication onBack={()=>{}} onAddNew={()=>{}}/> },
  { label: "Community contribute", el: <CommunityContribute onBack={()=>{}} onSubmit={()=>{}}/> },
];

const PrintDeck = () => (
  <div id="print-deck">
    {PRINT_SCREENS.map((s, i) => (
      <div className="print-page" key={i}>
        <div className="print-cap">{s.label}</div>
        <Phone time={s.time || "9:41"}>{s.el}</Phone>
      </div>
    ))}
  </div>
);

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PrintDeck/>);

// Auto-print once fonts + render settle
window.addEventListener("load", () => {
  const go = () => setTimeout(() => window.print(), 600);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
});

</script>
