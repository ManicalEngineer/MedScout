# Reverse proxy for api.getmedscout.com -> uvicorn on 127.0.0.1:8000.
# Install to /etc/nginx/sites-available/medscout-backend, then:
#   ln -s /etc/nginx/sites-available/medscout-backend /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Run `certbot --nginx -d api.getmedscout.com` afterward — it will rewrite
# this file to add the TLS server block automatically.

server {
    listen 80;
    server_name api.getmedscout.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
